[package]
name = "ri"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A minimal Rust coding agent with a terminal UI and OpenAI-compatible streaming provider"
license = "MIT"
repository = "https://github.com/Neonity2020/rico"
readme = "README.md"

[[bin]]
name = "rico"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.29", default-features = false, features = ["event-stream", "bracketed-paste"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
scopeguard = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
unicode-segmentation = "1"
